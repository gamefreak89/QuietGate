plugins {
    id 'com.android.application'
}

android {
    namespace 'org.open.quietgate'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.open.quietgate'
        minSdk 29
        targetSdk 35
        testInstrumentationRunner 'org.open.quietgate.DeviceVerification'
        versionCode 9
        versionName '0.8-alpha'
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
